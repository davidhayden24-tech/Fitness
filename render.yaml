# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then "New +" -> "Blueprint" in the Render
# dashboard and point it at the repo. Render provisions both services below
# from this one file.
#
# Chose Render over Railway/Fly.io for this default because a single
# render.yaml declares both the web service and the managed Postgres
# instance together - no separate manual DB provisioning step. Swap this
# out freely: apps/backend/Dockerfile is plain Docker and runs unmodified
# on Railway, Fly.io, or any other container host.

databases:
  - name: adaptfit-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: adaptfit-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adaptfit-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard - never commit this
      - key: CLERK_PUBLISHABLE_KEY
        sync: false # from the Clerk dashboard - the server won't boot without this
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false # raw JSON from the Google Cloud service account, not a file path
      - key: PORT
        value: 4000
